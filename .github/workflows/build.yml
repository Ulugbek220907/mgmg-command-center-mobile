name: MGM Command Center Mobile - CI & Multiplatform Export

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Unit Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests & Compile Multiplatform Metadata
        run: ./gradlew test :composeApp:compileCommonMainKotlinMetadata --stacktrace

  build-android:
    name: Build Android APK
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mgm-command-center-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Export iOS Framework (macOS Runner)
    needs: test-and-verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Frameworks (ARM64 & Simulator ARM64)
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkReleaseFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload iOS Frameworks
        uses: actions/upload-artifact@v4
        with:
          name: mgm-command-center-ios-frameworks
          path: composeApp/build/bin/ios*/*Framework/
